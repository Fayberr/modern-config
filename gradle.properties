# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.4
fabric_api_version=0.162.0+26.3

# Mod Properties
version=1.9.5
group=net.fayber
archives_base_name=modern-config
mod_id=modernconfig

# GUI library dependency (NOT bundled; see build.gradle). Also drives the
# fabric.mod.json depends pin lower bound. Keep this the plain mod version (no
# MC-version suffix): it goes straight into the fabric.mod.json "moderngui" range.
modern_gui_version=1.0.14

# Minecraft-specific Maven coordinate; update alongside modern_gui_version.
modern_gui_maven_version=1.0.14+26.3

# Cloth Config, for the optional bridge (compileOnly; pinned to the version the bridge was verified against).
cloth_config_version=26.3.159
