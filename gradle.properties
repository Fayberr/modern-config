# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.4
fabric_api_version=0.162.0+26.3

# Mod Properties
version=1.9.4
group=net.fayber
archives_base_name=modern-config
mod_id=modernconfig

# GUI library dependency (NOT bundled; see build.gradle). Also drives the
# fabric.mod.json depends pin lower bound. Keep this the plain mod version (no
# MC-version suffix): it goes straight into the fabric.mod.json "moderngui" range.
modern_gui_version=1.0.14

# The mavenLocal coordinate to actually compile/run against. mavenLocal has no MC-version
# axis, so the 26.2 Modern GUI build was published locally under "1.0.14+26.2" to avoid
# silently overwriting the 26.1.x folder's plain "1.0.14" coordinate (see modern-gui's
# build.gradle publishing block). Update this whenever modern_gui_version bumps.
modern_gui_maven_version=1.0.14+26.3

# Cloth Config, for the optional bridge (compileOnly; pinned to the version the bridge was verified against).
cloth_config_version=26.3.159

# This machine has no system-wide JDK 25, so pin Gradle to the local Temurin install.
# On machines where JAVA_HOME already points at a JDK >= 25 this line can be removed.
