plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

base {
	archivesName = project.archives_base_name
}

repositories {
	// The embedded modern-gui toolkit comes from mavenLocal (publish it with
	// `publishToMavenLocal` from the Modern GUI project first).
	mavenLocal()

	// Cloth Config, for the optional bridge only: compileOnly, guarded by a mixin plugin, so
	// Modern Config still runs (and the mixins stay inert) when Cloth is absent.
	maven { url = "https://maven.shedaniel.me/" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The GUI toolkit (widgets, Theme, CardList, Ui). Published to mavenLocal by the Modern GUI
	// project. Not bundled: modern-gui is a declared dependency (fabric.mod.json depends), so one
	// standalone copy serves every consumer. 26.1 is obfuscation-free, so no remapping is involved.
	implementation "net.fayber:modern-gui:${project.modern_gui_version}"

	// Cloth Config: compile against it for the bridge mixins, never ship or require it.
	compileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
}

// Dev-only design workbench: `./gradlew runClient -PmcPreview=true` boots the client at a fixed
// window size and auto-opens the demo config screen (see tools/preview.sh, which grabs a frame
// off an Xvfb display so the look can be iterated on headlessly).
loom {
	// Widens Screen.addRenderableWidget for the bridge's Cloth screen button mixins; without it a
	// @Shadow of that inherited method cannot resolve (see modernconfig.accesswidener).
	accessWidenerPath = file('src/main/resources/modernconfig.accesswidener')
	runs {
		client {
			programArgs '--width', '1280', '--height', '720'
			if (project.hasProperty('mcPreview')) {
				vmArg '-Dmodernconfig.preview=true'
			}
			if (project.hasProperty('mcPreviewScroll')) {
				vmArg "-Dmodernconfig.previewScroll=${project.property('mcPreviewScroll')}"
			}
		}
	}
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_version', project.minecraft_version
	inputs.property 'loader_version', project.loader_version
	inputs.property 'modern_gui_version', project.modern_gui_version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version,
				'minecraft_version': project.minecraft_version,
				'loader_version': project.loader_version,
				'modern_gui_version': project.modern_gui_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs << "-Xlint:deprecation"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// Loom wires the remapped (mojmap-named) jar into components.java, so consumers can depend on
// this as a plain `compileOnly "net.fayber:modern-config:<version>"` from mavenLocal, exactly
// like modmenu/cloth-config compileOnly works.
publishing {
	publications {
		create('mavenJava', MavenPublication) {
			// Publish under modern-config (the archivesBaseName), not the project name.
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
