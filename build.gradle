plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

base {
	archivesName = project.archives_base_name
}

repositories {
	// No third-party mod dependencies: the library is vanilla + fabric-api only.
	// Consumers (e.g. Waypoints) pull this jar from mavenLocal via `publishToMavenLocal`.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_version', project.minecraft_version
	inputs.property 'loader_version', project.loader_version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version,
				'minecraft_version': project.minecraft_version,
				'loader_version': project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// Loom wires the remapped (mojmap-named) jar into components.java, so consumers can depend on
// this as a plain `compileOnly "net.fayber:fayber-config:<version>"` from mavenLocal, exactly
// like modmenu/cloth-config compileOnly works.
publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}
